name: Publish to PyPI

# Publishes the package to PyPI whenever a version tag (e.g. v0.1.0) is pushed.
# Uses PyPI Trusted Publishing (OIDC), so no API token or secret is needed.
on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install -e ".[test]"
          python -m pytest
          python -m ruff check streamlit_dnd tests
          python -m ruff format --check streamlit_dnd tests
          node --check streamlit_dnd/frontend/main.js

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  e2e:
    name: Packaged E2E / Streamlit ${{ matrix.streamlit }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        streamlit: ["1.58.0", latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install wheel and E2E runtime
        run: |
          python -m pip install playwright
          python -m pip install --force-reinstall dist/*.whl
      - name: Install minimum Streamlit
        if: matrix.streamlit != 'latest'
        run: python -m pip install --force-reinstall "streamlit==${{ matrix.streamlit }}"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run real-input E2E
        run: python tests/e2e_real.py --browser chromium --artifacts test-results/e2e
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-e2e-${{ matrix.streamlit }}
          path: test-results/e2e/
          if-no-files-found: ignore

  publish:
    name: Publish to PyPI
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/streamlit-dnd/
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
